[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle-eye-backend"
version = "0.1.0"
description = "Eagle Eye - AI Vision for Cabinet QC (backend scaffold)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Heavy ML / document dependencies. Install in Phase 4 and Phase 7: pip install -e ".[ml,docs]"
ml = ["ultralytics>=8.3", "opencv-python-headless>=4.9", "easyocr>=1.7"]
docs = ["pymupdf>=1.24", "pandas>=2.1", "openpyxl>=3.1", "reportlab>=4.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
